[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinela-scan"
version = "0.1.0"
description = "Diagnóstico não-intrusivo de segurança para aplicações web, com relatório profissional."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Paulo Marcos Lucio", email = "pmlsp23@gmail.com" }]
keywords = [
  "security", "appsec", "web-security", "owasp", "tls", "http-headers",
  "vulnerability-assessment", "seguranca", "pentest", "lgpd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "dnspython>=2.6",
  "cryptography>=42",
  "tldextract>=5.1",
  "jinja2>=3.1",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/Paulo-Marcos-Lucio/sentinela"
Repository = "https://github.com/Paulo-Marcos-Lucio/sentinela"
Issues = "https://github.com/Paulo-Marcos-Lucio/sentinela/issues"

[project.scripts]
sentinela = "sentinela.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinela"]

[tool.ruff]
line-length = 108
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]           # asserts e credenciais fake nos testes

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tldextract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
