[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinela-scan"
# Fonte ÚNICA da versão: src/sentinela/version.py (o docstring de lá prometia isso,
# mas havia um literal aqui também — dois lugares independentes, nada checando que batem).
dynamic = ["version"]
description = "Diagnóstico não-intrusivo de segurança para aplicações web, com relatório profissional."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Paulo Marcos Lucio", email = "contatopml26@gmail.com" }]
keywords = [
  "security", "appsec", "web-security", "owasp", "tls", "http-headers",
  "vulnerability-assessment", "seguranca", "pentest", "lgpd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
# Piso E TETO em tudo. Sem teto, duas instalações em dias diferentes montam
# ferramentas diferentes — e o problema não é só "quebrar o import":
#
#   typer 0.12.0–0.12.3 não aceita a anotação `list[Formato] | None` do `--formato`
#   e, dependendo da versão, ou levanta RuntimeError na inicialização ou registra o
#   comando sem opções — a varredura sai com ZERO achado e código de saída 0. Num
#   pipeline, isso é um portão verde para sempre. Por isso o piso subiu de 0.12
#   para 0.15.
#
# O teto é sempre o próximo major (ou o próximo minor, onde o projeto ainda quebra
# contrato em minor). Subir teto é decisão consciente, com a suíte rodando antes.
dependencies = [
  "typer>=0.15,<0.30",
  "httpx>=0.27,<0.30",
  "dnspython>=2.6,<3",
  "cryptography>=42,<51",
  "tldextract>=5.1,<6",
  "jinja2>=3.1,<4",
  "rich>=13.7,<16",
  # Âncora de confiança TLS explícita: `checks/tls.py` valida a cadeia contra o
  # MESMO bundle que o httpx usa, para que duas máquinas com lojas de CA diferentes
  # cheguem ao mesmo veredito sobre o mesmo certificado.
  "certifi>=2024.2.2",
]

# Pisos das ferramentas de dev subidos para as versões efetivamente instaladas e
# testadas neste repo (portões verdes com elas). Piso, não pino: o Dependabot ainda
# pode propor um degrau acima — mas o CI e a máquina do dev partem da mesma linha de
# base, não de uma versão de 2022 que já não roda igual.
[project.optional-dependencies]
dev = [
  "ruff>=0.16",
  "mypy>=2.3",
  "hypothesis>=6.100",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  # Só para ler taxonomy/*.yaml em tests/test_taxonomy.py — mapping.py não importa
  # PyYAML, então isto não é dependência de runtime do pacote.
  "PyYAML>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/Paulo-Marcos-Lucio/sentinela"
Repository = "https://github.com/Paulo-Marcos-Lucio/sentinela"
Issues = "https://github.com/Paulo-Marcos-Lucio/sentinela/issues"

[project.scripts]
sentinela = "sentinela.cli:app"

[tool.hatch.version]
path = "src/sentinela/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinela"]

[tool.ruff]
line-length = 108
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]           # asserts e credenciais fake nos testes

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tldextract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# O portão de cobertura mora AQUI, não no CI: assim `make test`, o pre-commit e o CI
# rodam exatamente a mesma coisa. O limiar é o valor medido hoje arredondado para baixo
# (93%) — é um portão ANTI-REGRESSÃO, não uma aspiração. Para rodar um arquivo só sem o
# portão: `pytest tests/test_x.py --no-cov`.
addopts = "-ra --strict-markers --cov=sentinela --cov-report=term-missing --cov-fail-under=90"
