name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint · Tipos · Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions fixadas por SHA: uma tag como `@v4` é um ponteiro MÓVEL, e quem controla o
      # repositório da action pode reapontá-la. É exatamente o que a Esteira (a ferramenta
      # de CI desta mesma suíte) exige de qualquer workflow que audita — não faria sentido
      # cobrar isso do cliente e não fazer aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # O portão de cobertura (--cov-fail-under) vem do pyproject.toml: o CI e o
      # `make test` rodam literalmente o mesmo comando.
      - run: pytest
