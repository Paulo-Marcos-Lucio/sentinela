name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default de menor privilégio para todo o workflow; cada job redeclara o que precisa.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint · Tipos · Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions fixadas por SHA: uma tag como `@v4` é um ponteiro MÓVEL, e quem controla o
      # repositório da action pode reapontá-la. É exatamente o que a Esteira (a ferramenta
      # de CI desta mesma suíte) exige de qualquer workflow que audita — não faria sentido
      # cobrar isso do cliente e não fazer aqui.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # O portão de cobertura (--cov-fail-under) vem do pyproject.toml: o CI e o
      # `make test` rodam literalmente o mesmo comando.
      - run: pytest

  autoauditoria:
    # Dogfood: a Sentinela roda contra um alvo local para provar, a cada push, que o
    # caminho CLI → varredura → relatório funciona ponta a ponta no CI (não só nos testes).
    # O alvo é um `http.server` descartável — por isso NÃO subimos o SARIF para o code
    # scanning do repo (poluiria a aba Security com "SEM_HTTPS no localhost"); a análise
    # do código real deste repo é feita pelo workflow codeql.yml. Aqui `--falhar-em nenhum`
    # mantém o job verde: o objetivo é o smoke test do binário, não gatear achados.
    name: Autoauditoria (dogfood contra alvo local)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e "."

      - name: Sobe um alvo HTTP local
        run: |
          python -m http.server 8899 --bind 127.0.0.1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Espera a porta responder antes de varrer.
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8899; then break; fi
            sleep 0.5
          done

      - name: Varre o alvo local e gera SARIF + console
        run: |
          sentinela scan http://127.0.0.1:8899 --perfil rapido \
            -f console -f sarif -o sentinela.sarif --falhar-em nenhum

      - name: Encerra o alvo local
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
