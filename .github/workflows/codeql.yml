name: CodeQL

# Análise estática de segurança do GitHub sobre o código deste repositório (Python).
# Roda em push/PR na main e uma vez por semana — vulnerabilidade nova em regra do CodeQL
# aparece mesmo sem um commit provocá-la.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # segunda-feira, 04:27 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # publicar alertas na aba Security
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.7
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Python é interpretado: o CodeQL não precisa de passo de build.
      - name: Analisar
        uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.7
        with:
          category: "/language:${{ matrix.language }}"
