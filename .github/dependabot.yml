# Fixar action por SHA sem mecanismo de atualização é congelar a versão — inclusive uma
# versão vulnerável. O Dependabot é a outra metade da prática: PRs agrupados, semanais.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
